<style>
/* Single-screen card study app — tap to flip, swipe to advance */
:root {
  --bg: #f7f7f5; --surface: #ffffff; --fg: #1a1a1a; --fg2: #6b6b6b;
  --accent: #2a6b5a; --accent-light: #e8f4ef; --border: #e5e5e3;
  --flip-bg: #2a6b5a; --flip-fg: #ffffff;
  font-family: 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161616; --surface: #222222; --fg: #e8e8e6; --fg2: #9a9a9a;
  --accent: #4ecba0; --accent-light: #1e3a30; --border: #333;
  --flip-bg: #4ecba0; --flip-fg: #111; color-scheme: dark;
}}
:root[data-theme="dark"] {
  --bg: #161616; --surface: #222222; --fg: #e8e8e6; --fg2: #9a9a9a;
  --accent: #4ecba0; --accent-light: #1e3a30; --border: #333;
  --flip-bg: #4ecba0; --flip-fg: #111; color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; min-height: 100vh;
  max-width: 640px; margin: 0 auto;
}
h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.5rem; margin: 0; }
.top-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 12px; flex-wrap: wrap; gap: 8px; }
.unit-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.unit-tabs button, .mode-toggle button {
  font-family: inherit; font-size: .8rem; font-weight: 500;
  border: 1px solid var(--border); background: var(--surface); color: var(--fg2);
  padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: all .15s;
}
.unit-tabs button.active, .mode-toggle button.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.mode-toggle { display: flex; gap: 6px; margin-bottom: 8px; }
.progress { font-size: .8rem; color: var(--fg2); padding-bottom: 8px; font-variant-numeric: tabular-nums; }
.card-area { flex: 1; display: flex; align-items: center; justify-content: center; gap: 12px; perspective: 800px; padding: 8px 0 16px; }
.card { width: 100%; max-width: 480px; min-height: 280px; position: relative; cursor: pointer; transform-style: preserve-3d; transition: transform .45s ease; }
.card.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px 28px; text-align: center; box-sizing: border-box;
}
.card-front { background: var(--surface); border: 1px solid var(--border); }
.card-back { background: var(--flip-bg); color: var(--flip-fg); transform: rotateY(180deg); }
.card-word { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
.card-pos { font-size: .85rem; opacity: .6; margin-bottom: 4px; }
.card-hint { font-size: .85rem; opacity: .55; margin-top: 12px; }
.card-def { font-size: 1.05rem; line-height: 1.55; }
.nav-btn {
  flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
  font-family: inherit; font-size: 1.2rem; line-height: 1;
  background: var(--surface); border: 1px solid var(--border); color: var(--fg);
  border-radius: 50%; cursor: pointer; transition: all .15s; -webkit-tap-highlight-color: transparent;
}
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn:active { transform: scale(.92); }
.nav-btn:disabled { opacity: .25; cursor: default; }
@media (max-width: 520px) { .nav-btn { width: 38px; height: 38px; font-size: 1.05rem; } .card-area { gap: 6px; } }
.shuffle-btn {
  font-family: inherit; font-size: .8rem; font-weight: 500;
  background: none; border: none; color: var(--accent); cursor: pointer; padding: 4px 0;
}
</style>

let vocab = [...ALL_VOCAB];
let idx = 0;
let mode = 'def';
let dir = 'normal';
let unit = 'all';

function setUnit(u) {
  unit = u;
  vocab = u === 'all' ? [...ALL_VOCAB] : ALL_VOCAB.filter(v => v.u === u);
  idx = 0;
  document.querySelectorAll('.unit-tabs button').forEach((b,i) => {
    b.classList.toggle('active', i === 0 ? u === 'all' : u === i);
  });
  render();
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-toggle')[0].querySelectorAll('button:not(.shuffle-btn)').forEach((b,i) => {
    b.classList.toggle('active', (i===0 && m==='def') || (i===1 && m==='vi'));
  });
  render();
}

function setDir(d) {
  dir = d;
  document.querySelectorAll('.mode-toggle')[1].querySelectorAll('button').forEach((b,i) => {
    b.classList.toggle('active', (i===0 && d==='normal') || (i===1 && d==='reverse'));
  });
  render();
}

function shuffle() {
  for (let i = vocab.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [vocab[i], vocab[j]] = [vocab[j], vocab[i]];
  }
  idx = 0;
  render();
}

function flip() {
  document.getElementById('card').classList.toggle('flipped');
}

function next() { if (idx < vocab.length - 1) { idx++; render(); } }
function prev() { if (idx > 0) { idx--; render(); } }

function render() {
  const c = vocab[idx];
  const card = document.getElementById('card');
  card.classList.remove('flipped');

  const front = document.getElementById('front');
  const back = document.getElementById('back');

  if (dir === 'normal') {
    front.innerHTML = `<div class="card-word">${c.w}</div><div class="card-pos">(${c.pos})${c.ipa ? ' ' + c.ipa : ''}</div><div class="card-hint">tap to reveal</div>`;
    if (mode === 'def') {
      back.innerHTML = `<div class="card-def">${c.def}</div>`;
    } else {
      back.innerHTML = `<div class="card-word" style="font-size:1.3rem">${c.vi}</div>`;
    }
  } else {
    if (mode === 'def') {
      front.innerHTML = `<div class="card-def">${c.def}</div><div class="card-hint">tap to reveal word</div>`;
    } else {
      front.innerHTML = `<div class="card-word" style="font-size:1.3rem">${c.vi}</div><div class="card-hint">tap to reveal word</div>`;
    }
    back.innerHTML = `<div class="card-word">${c.w}</div><div class="card-pos">(${c.pos})${c.ipa ? ' ' + c.ipa : ''}</div>`;
  }

  document.getElementById('progress').textContent = `${idx + 1} / ${vocab.length}` + (unit === 'all' ? '' : ` — Unit ${unit}`);
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === vocab.length - 1;
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
});

let touchStartX = 0;
document.getElementById('card').addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].clientX; }, {passive:true});
document.getElementById('card').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) { dx > 0 ? prev() : next(); }
  else flip();
});

render();
</script>
